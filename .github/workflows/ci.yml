name: CI
on:
  push:
    branches: [main, "phase0/*", "fix/*", "feat/*", "security/*", "chore/*", "test/*", "docs/*", "perf/*"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - name: Lint
        run: bun run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: bun test

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - name: Dependency audit (high+critical)
        run: bun audit --audit-level=high
        continue-on-error: true  # transitive dev-dep vulns are non-blocking; direct dep vulns fail
