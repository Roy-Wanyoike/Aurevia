name: CI
on:
  push:
    branches: [main, "phase0/*", "fix/*", "feat/*"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - name: Lint
        run: bun run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: bun test
      - name: Build
        run: bun run build
