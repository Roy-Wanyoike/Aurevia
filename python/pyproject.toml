[project]
name = "aurevia-quant"
version = "0.1.0"
description = "Aurevia quantitative research and backtesting platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "polars>=1.0",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
